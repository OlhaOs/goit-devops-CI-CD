controller:
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "lts-jdk17"

  javaOpts: "-Xms256m -Xmx512m"

  admin:
    username: admin
    password: ${jenkins_admin_password}

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "768Mi"
    requests:
      cpu: "100m"
      memory: "384Mi"

  persistence:
    enabled: true
    storageClass: "ebs-sc"
    size: 10Gi

  installPlugins:
    - "kubernetes"
    - "workflow-aggregator"
    - "git"
    - "aws-credentials"
    - "configuration-as-code"
    - "amazon-ecr"
    - "job-dsl"

  

  serviceAccount:
    name: jenkins-sa
    create: false

  JCasC:
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: ${github_username}
                      password: ${github_pat}
                      description: GitHub PAT
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('${github_url}')
                      credentials('github-token')
                    }
                    branches('${github_main_branch}')
                  }
                }
                steps {
                  dsl {
                    text("""
                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('${github_url}')
                                  credentials("github-token")
                                }
                                branches("${github_main_branch}")
                              }
                            }
                            scriptPath("Jenkinsfile")
                          }
                        }
                      }
                    """)
                  }
                }
              }
sidecars:
  configAutoReload:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi