apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-django
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-django
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-django
    spec:
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          env:
            - name: DB_HOST
              value: {{ .Values.config.db_host | quote }}
            - name: DB_NAME
              value: {{ .Values.config.db_name | quote }}
            - name: DB_USER
              value: {{ .Values.config.db_user | quote }}
            - name: DB_PASS
              value: {{ .Values.config.db_pass | quote }}
            - name: DB_PORT
              value: {{ .Values.config.db_port | default "5432" | quote }}
       
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          command: {{ .Values.image.command | toJson }}